<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard Barber — Barber &amp; Brew</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="font-sans bg-stone-100 text-stone-900 antialiased">

    <!-- Navbar -->
<!-- Navbar -->
<nav class="bg-stone-950/95 backdrop-blur-md text-white border-b border-white/10 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-5 md:px-8 py-4 flex justify-between items-center">
        <!-- Logo -->
        <a href="index.html" class="display font-serif text-2xl font-bold">
            Barber<span class="brand text-amber-400">&amp;Brew</span>
        </a>

        <!-- Navigation Actions -->
        <div class="flex items-center gap-3 sm:gap-4">
            <span
                class="hidden sm:inline-flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-white/10 text-stone-200">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                Dashboard Barber
            </span>

            <button
                class="rounded-xl border border-white/25 bg-transparent px-4 py-2 text-sm font-semibold text-white hover:border-amber-400 hover:bg-white/5 hover:text-amber-400 transition-colors"
                data-logout>
                Keluar
            </button>
        </div>
    </div>
</nav>

    <!-- Atmospheric Barbershop Header -->
    <header class="relative overflow-hidden bg-stone-950 text-white pb-20 pt-10 md:pt-12">
        <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1800&q=80"
            alt="Area kerja barber" class="absolute inset-0 h-full w-full object-cover object-center opacity-35">
        <div class="absolute inset-0 bg-gradient-to-r from-stone-950 via-stone-950/90 to-stone-950/65"></div>

        <div class="relative z-10 max-w-5xl mx-auto px-5 md:px-8 flex flex-wrap justify-between items-end gap-4">
            <div>
                <p class="brand text-amber-400 text-xs font-bold tracking-widest uppercase">
                    BARBER WORKSPACE
                </p>

                <h1 class="display font-serif text-3xl sm:text-4xl font-bold mt-1.5">
                    Daftar reservasi
                </h1>

                <p class="text-stone-300 text-sm sm:text-base mt-2">
                    Menampilkan jadwal reservasi yang ditugaskan khusus ke akun barber ini.
                </p>
            </div>

            <div class="text-xs font-medium bg-white/10 backdrop-blur-md border border-white/15 rounded-xl px-4 py-2.5">
                <span class="text-stone-300 block text-[11px]">Hari ini</span>
                <span id="barber-today" class="font-semibold text-amber-400"></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-20 max-w-5xl mx-auto px-5 md:px-8 -mt-12 pb-14">

        <!-- Notification -->
        <div id="barber-message"
            class="notice rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm font-medium text-amber-900 shadow-sm mb-5"
            hidden></div>

        <!-- Booking List -->
        <section id="barber-bookings" class="space-y-4">
            <div class="rounded-2xl border border-stone-200 bg-white p-8 text-center text-stone-500 text-sm shadow-md">
                Memuat reservasi…
            </div>
        </section>

    </main>

    <!-- Display Current Date -->
    <script>
        const todayEl = document.getElementById('barber-today');
        if (todayEl) {
            todayEl.textContent = new Intl.DateTimeFormat('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(new Date());
        }
    </script>

    <!-- JavaScript -->
    <script src="assets/js/app.js"></script>

</body>

</html>
