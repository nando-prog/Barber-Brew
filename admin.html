<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konfirmasi Pembayaran — Barber & Brew</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="bg-stone-950 text-white px-6 md:px-12 py-5 flex justify-between items-center"><a href="index.html" class="display text-2xl font-bold">Barber<span class="brand">&amp;Brew</span></a><div class="flex items-center gap-4"><span class="text-sm text-stone-300">Admin</span><button class="btn btn-outline text-sm" data-logout>Keluar</button></div></nav><main class="max-w-4xl mx-auto px-5 py-12"><p class="brand text-xs font-bold tracking-widest">ADMIN TOOL</p><h1 class="display text-4xl font-bold mt-2">Konfirmasi pembayaran</h1><p class="text-stone-500 mt-3">Daftar pesanan pelanggan. Pesanan yang menunggu pembayaran tampil paling atas. Klik <b>Konfirmasi</b> setelah memeriksa pembayaran tunai secara langsung.</p><div id="admin-message" class="notice mt-6" hidden></div><div class="panel p-6 mt-6"><div class="grid sm:grid-cols-3 gap-3"><input class="field sm:col-span-2" id="order-search" type="search" placeholder="Cari kode pesanan, ID, atau nama pelanggan" autocomplete="off"><select class="field" id="order-filter"><option value="pending">Menunggu pembayaran</option><option value="all">Semua pesanan</option></select></div><div id="admin-orders" class="space-y-4 mt-5"><p class="text-stone-500">Memuat pesanan…</p></div></div><div class="panel p-6 mt-6"><h2 class="display text-xl font-bold">Konfirmasi manual</h2><p class="text-sm text-stone-500 mt-1 mb-4">Masukkan <b>kode pesanan</b> (contoh: BB261121AB12CD) atau ID angka.</p><form id="payment-form" class="flex flex-wrap gap-3"><input class="field flex-1 min-w-48" id="order-ref" name="order_ref" type="text" required maxlength="32" autocomplete="off" placeholder="Kode atau ID pesanan"><button class="btn btn-dark" type="submit">Konfirmasi pembayaran tunai</button></form></div></main><script src="assets/js/app.js"></script></body></html>
