<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Masuk — Barber & Brew</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="min-h-screen">

    <!-- Main Authentication Layout -->
    <main class="auth-grid min-h-screen grid grid-cols-2">

        <!-- Authentication Form Section -->
        <section class="page-pad px-8 md:px-16 py-12 flex flex-col justify-center">

            <!-- Brand Logo -->
            <a href="index.html" class="display text-2xl font-black">
                Barber<span class="brand">&amp;Brew</span>
            </a>

            <!-- Authentication Content -->
            <div class="max-w-md w-full mx-auto mt-12">

                <!-- Page Heading -->
                <h1 id="auth-title" class="display text-4xl font-bold">
                    Selamat Datang
                </h1>

                <p id="auth-subtitle" class="text-stone-500 mt-2 mb-8">
                    Masuk untuk melanjutkan pesanan dan reservasi.
                </p>

                <!-- Notification -->
                <div id="auth-message" class="notice mb-5" hidden></div>

                <!-- Login and Register Form -->
                <form id="auth-form" class="space-y-4">

                    <!-- Authentication Mode -->
                    <input type="hidden" id="auth-mode" value="login">

                    <!-- Register Only: Full Name -->
                    <div data-register-only hidden>

                        <label class="block text-sm font-semibold mb-2" for="name">
                            Nama lengkap
                        </label>

                        <input class="field" id="name" name="name" autocomplete="name" minlength="2"
                            placeholder="Nama lengkap">

                    </div>

                    <!-- Register Only: Phone Number -->
                    <div data-register-only hidden>

                        <label class="block text-sm font-semibold mb-2" for="phone">
                            Nomor telepon
                        </label>

                        <input class="field" id="phone" name="phone" autocomplete="tel" inputmode="tel"
                            placeholder="08xxxxxxxxxx">

                    </div>

                    <!-- Email -->
                    <div>

                        <label class="block text-sm font-semibold mb-2" for="email">
                            Email
                        </label>

                        <input class="field" id="email" name="email" type="email" required autocomplete="email"
                            placeholder="nama@email.com">

                    </div>

                    <!-- Password -->
                    <div>

                        <label class="block text-sm font-semibold mb-2" for="password">
                            Password
                        </label>

                        <input class="field" id="password" name="password" type="password" required minlength="8"
                            autocomplete="current-password" placeholder="Minimal 8 karakter">

                    </div>

                    <!-- Submit Button -->
                    <button id="auth-submit" class="btn btn-dark w-full mt-3" type="submit">
                        Masuk
                    </button>

                </form>

                <!-- Switch Login / Register -->
                <p class="text-sm text-center text-stone-500 mt-6">

                    <span id="switch-copy">
                        Belum punya akun?
                    </span>

                    <a href="#" id="switch-mode" class="font-bold text-amber-700">
                        Daftar sekarang
                    </a>

                </p>

                <!-- Back to Homepage -->
                <p class="text-xs text-stone-400 text-center mt-8">
                    <a href="index.html">
                        ← Kembali ke beranda
                    </a>
                </p>

            </div>

        </section>

        <!-- Branding Illustration Section -->
        <aside class="auth-aside bg-stone-950 text-white flex items-center justify-center p-12">

            <div class="max-w-md text-center">

                <!-- Illustration -->
                <div class="text-8xl mb-8">
                    💈
                </div>

                <!-- Branding Heading -->
                <h2 class="display text-4xl font-bold">
                    Potong Rambut<br>

                    <span class="text-amber-400">
                        Sambil Ngopi
                    </span>
                </h2>

                <!-- Branding Description -->
                <p class="text-stone-300 leading-relaxed mt-5">
                    Reservasi layanan barber dan pesan produk café
                    melalui satu platform.
                </p>

            </div>

        </aside>

    </main>

    <!-- JavaScript -->
    <script src="assets/js/app.js"></script>

</body>

</html>
